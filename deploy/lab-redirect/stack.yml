# Depois da migração: naosalvo-local e naosalvo-dev (que ficam no servidor 2) só redirecionam para naosalvo.fishlab.com.br.
# Substitui as stacks naosalvo, naosalvo-dev e naosalvo-deployer do servidor 2 (remova-as ANTES: duas rotas com o mesmo Host brigam).
#   docker --context servidor2 stack deploy --resolve-image never -c deploy/lab-redirect/stack.yml naosalvo-redirect
# Redireciona preservando caminho e query (301). Sem banco, sem segredo.
version: '3.8'
services:
  redirect:
    image: nginx:alpine
    command:
      - sh
      - -c
      - |
        printf 'server {\n  listen 80;\n  return 301 https://naosalvo.fishlab.com.br$$request_uri;\n}\n' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    networks:
      - v0net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=v0net"
        - "traefik.http.routers.naosalvo-redirect.rule=Host(`naosalvo-local.fishlab.com.br`) || Host(`naosalvo-dev.fishlab.com.br`)"
        - "traefik.http.routers.naosalvo-redirect.entrypoints=websecure"
        - "traefik.http.routers.naosalvo-redirect.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.naosalvo-redirect.loadbalancer.server.port=80"
networks:
  v0net:
    external: true
