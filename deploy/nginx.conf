server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # endereço que não existe: página 404 do site ("Onde é que eu tô?"), com o status 404 de verdade
  error_page 404 /404.html;
  absolute_redirect off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  # versão publicada: nunca em cache, para a tarja do rodapé mostrar sempre a última
  location = /versao.json { add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
  # Mídias enviadas pelo MCP/painel: moram no MinIO (bucket naosalvo, prefixo midias/) e saem por aqui, por proxy, sem expor o MinIO.
  # Usa o domínio público do S3: o MinIO recusa o nome interno minio_minio ("invalid hostname": o _ não vale em hostname).
  # O nome é resolvido a cada pedido (resolver do Docker), então o site sobe mesmo com o MinIO fora do ar. Só GET/HEAD, só nome simples.
  location ~ ^/midias/([A-Za-z0-9._-]+)$ {
    limit_except GET HEAD { deny all; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $s3 https://s3.fishlab.com.br;
    proxy_pass $s3/naosalvo/midias/$1;
    proxy_http_version 1.1;
    proxy_set_header Host s3.fishlab.com.br;
    proxy_ssl_server_name on;
    proxy_ssl_name s3.fishlab.com.br;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 400 401 403 404 405 = @sem_midia;
    proxy_hide_header Server;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-bucket-region;
    proxy_hide_header x-minio-deployment-id;
    proxy_hide_header Strict-Transport-Security;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
  }
  location @sem_midia { return 404; }
  location /seppzone/ { add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri $uri/ =404; }
  location /dashboard/ { add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri $uri/ =404; }
  location / { try_files $uri $uri/ =404; }
}
