<style>
:root{--Comum:#8e939c;--Relevante:#2fbf5b;--Raro:#2f86ff;--Relíquia:#a35cff;--Lendário:#e8a317;--Mítico:#ff4a4a}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:18px;padding:18px 22px 40px;max-width:1500px;margin:0 auto}
.side h6{font-size:12px;letter-spacing:1.4px;color:var(--mut);font-weight:700;margin:6px 0 10px;text-transform:uppercase}
.side,.side>h6{scroll-margin-top:calc(var(--hdh,64px) + 56px)}
.col{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px;border:1px solid transparent;margin-bottom:4px}
.col:hover{background:var(--panel2)}
.col.on{border-color:var(--line2);background:var(--brand-soft);box-shadow:0 0 18px var(--glow)}
.col .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px}
.col b{display:block;font-size:12px;letter-spacing:.3px;text-transform:uppercase;font-weight:800}
.col small{font-size:12px;color:var(--mut)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px;flex:1}
.bar i{display:block;height:100%;border-radius:3px}
.prow{display:flex;align-items:center;gap:8px}.prow span{font-size:12px;color:var(--mut)}
.tot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.tot .n{font-family:Rajdhani;font-size:40px;font-weight:700;color:var(--brand-display);line-height:1}.tot .n small{font-size:20px;color:var(--mut);font-weight:500}
.rar{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.rar span{display:flex;align-items:center;gap:5px}.rar i{width:11px;height:11px;border-radius:3px}
.packbtn{width:100%;margin-top:16px;padding:13px;border-radius:12px;background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--on-brand);font-weight:800;letter-spacing:.5px;font-size:12.5px;box-shadow:0 6px 22px var(--glow)}
.packbtn,.ib{display:flex!important;align-items:center;justify-content:center;gap:8px}.packbtn .ico,.ib .ico{width:17px;height:17px}
.wallet .c{display:flex;align-items:center;gap:6px}#coinIc .ico{width:26px;height:26px}
.packbtn:disabled{opacity:.45;box-shadow:none;cursor:default}
.ghost{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--mut);background:var(--panel);font-weight:600;text-align:center;text-decoration:none}
.ghost:hover{border-color:var(--brand);color:var(--brand-ink)}
.wallet{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.wallet .c{font-family:Rajdhani;font-size:30px;font-weight:700;color:var(--gold);line-height:1}
.wallet .c small{font-size:13px;color:var(--mut);font-weight:500;margin-left:4px}
.ghost.go{border-color:color-mix(in srgb,var(--gold) 50%,transparent);color:var(--gold-text)}
/* álbum */
.album{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:22px 26px 18px 54px;box-shadow:var(--shadow);min-width:0}
.rings{position:absolute;left:-10px;top:26px;bottom:26px;width:36px;background:radial-gradient(circle at 50% 50%,var(--bg) 0 6px,#d8d8e2 6.5px 8px,#777 8.5px 10px,transparent 10.5px) 0 0/36px 34px repeat-y}
.ahead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ahead h1{font-size:36px;letter-spacing:1px;line-height:1;font-weight:700;text-transform:uppercase}
.ahead .pr{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:13px;color:var(--mut)}.ahead .pr .bar{width:170px;margin:0;height:7px}
.about{border:1px solid var(--line2);border-radius:10px;padding:9px 14px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--panel)}
.about:hover{border-color:var(--brand);color:var(--brand-ink)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{position:relative;aspect-ratio:3/4.1;border-radius:14px;padding:6px;text-align:left;border:2px solid var(--rc);background:linear-gradient(160deg,#1a1f2c,#0b0e16);color:#ececf6;box-shadow:0 0 16px color-mix(in srgb,var(--rc) 40%,transparent);transition:.2s;overflow:hidden;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 0 28px color-mix(in srgb,var(--rc) 70%,transparent)}
.card.sel{outline:3px solid var(--brand);outline-offset:2px}
.card .top{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:2px 5px 4px;font-family:Rajdhani}
.card .top em{font-style:normal;color:var(--rc);text-transform:uppercase}
.card .art{flex:1;border-radius:8px;display:grid;place-items:center;font-size:clamp(40px,5.5vw,70px);position:relative;overflow:hidden}
.card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff33 48%,transparent 60%);transform:translateX(-120%);transition:transform .6s}
.card:hover .art::after{transform:translateX(120%)}
.card .nm{margin-top:6px;border:1px solid color-mix(in srgb,var(--rc) 70%,#000);border-radius:6px;background:#06070b;text-align:center;font-family:Rajdhani;font-weight:700;font-size:clamp(11px,1.3vw,15px);text-transform:uppercase;padding:6px 4px;letter-spacing:.4px;line-height:1.05;display:flex;align-items:center;justify-content:center;min-height:36px}
.card .ft{text-align:center;font-size:9.5px;color:#8a8aa3;padding:5px 0 2px;letter-spacing:.5px}
.card .star{position:absolute;right:8px;top:30px;font-size:16px;z-index:2}
.card.lock{--rc:var(--line2);background:var(--sunk);color:var(--mut);box-shadow:none}
.card.lock .art{background:repeating-linear-gradient(45deg,var(--panel2) 0 6px,var(--sunk) 6px 12px);font-size:64px;color:var(--line2)}
.card.lock .nm{background:var(--panel);color:var(--mut)}
.card.lock .ft{color:var(--faint)}
.card .cp{position:absolute;left:8px;top:30px;font-size:10px;background:#000b;border-radius:10px;padding:1px 6px;z-index:2;font-weight:700}
.card .yr{position:absolute;right:8px;bottom:62px;font-size:9.5px;background:#000b;border-radius:6px;padding:1px 6px;z-index:2;font-weight:700;font-family:Rajdhani;letter-spacing:.5px}
.card.foil .art::before{content:"";position:absolute;top:0;bottom:0;left:-100%;width:300%;background:linear-gradient(120deg,transparent 20%,#ff00c855 35%,#00e1ff55 50%,#fff20055 65%,transparent 80%);mix-blend-mode:color-dodge;animation:holo2 3.5s linear infinite;pointer-events:none;will-change:transform}
@keyframes holo2{from{transform:translateX(33%)}to{transform:translateX(-33%)}}
@keyframes holo{from{background-position:100% 0}to{background-position:-200% 0}}
.card.Mítico{animation:pulseM 2.2s ease-in-out infinite}
@keyframes pulseM{50%{box-shadow:0 0 34px color-mix(in srgb,var(--rc) 85%,transparent)}}
.pager{display:flex;justify-content:center;gap:8px;margin-top:16px}
.pager button{width:36px;height:34px;border:1px solid var(--line2);border-radius:10px;font-weight:700;font-size:13px;background:var(--panel)}
.pager button.on{background:var(--brand-fill);color:var(--on-brand);border-color:var(--brand-fill);box-shadow:0 0 14px var(--glow)}
.pager button:disabled{opacity:.3}
/* detalhe */
.det{border-left:1px solid var(--line);padding-left:18px;position:sticky;top:calc(var(--hdh,64px) + 12px);align-self:start}
.det .h{display:flex;justify-content:space-between;align-items:center}
.det .h b{font-family:Rajdhani;font-size:26px}
.chipR{border:1px solid var(--rc);color:var(--rc);padding:5px 11px;border-radius:6px;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;background:color-mix(in srgb,var(--rc) 14%,transparent)}
.det .card{margin:12px 0 14px;width:100%;pointer-events:none;aspect-ratio:3/3.9}
.det h2{font-size:26px;line-height:1.05}
.det p{font-size:12.5px;color:var(--mut);line-height:1.55;margin:8px 0 14px}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);padding:4px 0}.kv b{color:var(--txt);font-weight:600}
.det .worth{display:flex;justify-content:space-between;font-size:12px;color:var(--gold);padding:4px 0}
.bigbtn{width:100%;padding:12px;border:1px solid var(--brand);border-radius:10px;color:var(--brand-ink);font-weight:800;letter-spacing:.5px;font-size:12px;margin-top:12px;text-transform:uppercase;background:var(--brand-soft)}
.bigbtn:hover{background:color-mix(in srgb,var(--brand) 22%,transparent)}
.det .play{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:#e62117;color:#fff;font-size:12px;font-weight:800;letter-spacing:.5px}
.det .play:hover{filter:brightness(1.1)}
.sm{width:100%;padding:11px;font-size:12px;font-weight:600;color:var(--mut);margin-top:4px}
.sm:hover{color:var(--brand-text)}
/* compartilhar: item de compartilhamento (ícone no círculo, texto, seta), sem degradê */
.shrbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--txt);box-shadow:0 1px 3px #0000000f;cursor:pointer;text-align:left;font:800 13.5px Inter,sans-serif;transition:border-color .15s,background .15s}
.shrbtn .ci{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text)}
.shrbtn .ci .ico{width:18px;height:18px}
.shrbtn .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.shrbtn .tx small{font-weight:500;font-size:12px;color:var(--mut)}
.shrbtn .chev{flex:none;font-size:22px;line-height:1;color:var(--mut);font-weight:400;transition:transform .15s}
.shrbtn:hover{border-color:var(--brand);background:var(--panel2)}.shrbtn:hover .chev{transform:translateX(3px)}
.shrbtn:focus-visible{outline:3px solid #ffbf00;outline-offset:2px}
.copies{text-align:center;font-size:12px;color:var(--mut);margin-top:10px}
/* modais */
.modal{position:fixed;inset:0;background:var(--overlay);display:none;place-items:center;z-index:65;padding:20px;overflow:auto}
.modal.open{display:grid}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:24px;max-width:900px;width:100%;box-shadow:var(--shadow);position:relative}
.mbox h3{font-size:28px;text-align:center;margin-bottom:4px}
.mbox.shrbox{max-width:620px}
.mbox.shrbox h3{padding:0 48px}
.shr{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:start;margin-top:14px}
.shr-tx p{font-size:14px;line-height:1.5;margin-bottom:12px}
.shr-tx label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.shr-tx textarea{width:100%;min-height:88px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--sunk);color:var(--txt);font:inherit;font-size:14px;resize:vertical}
.shr-tx small{display:block;font-size:12px;color:var(--mut);margin-top:4px}
.shr-bt{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.shr-bt .mclose{margin:0;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
@media(max-width:560px){.mbox.shrbox h3{font-size:22px}.shr{grid-template-columns:1fr}.shr>.card,.shr>div:first-child{max-width:170px;margin:0 auto}.shr-bt .mclose{flex:1 1 100%}}
.mbox>p{text-align:center;color:var(--mut);font-size:13px;margin-bottom:16px}
.pack{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;perspective:900px}
.flip{position:relative;aspect-ratio:3/4.1;transform-style:preserve-3d;transition:transform .7s;cursor:pointer}
.flip.f{transform:rotateY(180deg)}
.flip>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px}
.flip .back{background:linear-gradient(135deg,#1597d3,#05384a);border:2px solid #4fc3f4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Rajdhani;font-weight:700;font-size:13px;letter-spacing:1px;color:#d8f1fc;box-shadow:0 0 24px var(--glow)}
.flip .back b{font-size:46px;line-height:1}
.flip .back.glow{border-color:var(--rc);box-shadow:0 0 26px var(--rc),inset 0 0 22px color-mix(in srgb,var(--rc) 40%,transparent)}
.flip .front{transform:rotateY(180deg)}
.flip .front .card{width:100%;height:100%;pointer-events:none}
.new{position:absolute;top:-8px;right:-6px;background:#ff3b6b;color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;z-index:5;letter-spacing:.5px}
.mclose{margin:18px auto 0;display:block;padding:12px 28px;border-radius:12px;background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--on-brand);font-weight:800;letter-spacing:.6px;box-shadow:0 6px 20px var(--glow)}
.rk{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:13px}
.rk.cid{background:linear-gradient(90deg,#ffd23f22,transparent);border-radius:8px}.rk.cid b{font-size:16px}.rk small{display:block;font-size:12px;color:var(--mut)}
.rk b{width:22px;text-align:center;color:var(--mut)}.rk .av{width:30px;height:30px;border-radius:50%;overflow:hidden}.rk .av svg{width:100%;height:100%;display:block}.rk span{flex:1}.rk em{font-style:normal;color:var(--brand-text);font-weight:700}
.note{grid-column:1/-1;text-align:center;font-size:12px;color:var(--faint);margin-top:6px}
.pk-wrap{display:grid;place-items:center;padding:10px 0 4px;perspective:900px}
.pk{position:relative;width:220px;height:310px;cursor:pointer;animation:float 2.6s ease-in-out infinite}
.pk:hover{animation:shake .35s linear infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-1deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) translateX(-2px)}75%{transform:rotate(3deg) translateX(2px)}}
.pk>div{position:absolute;left:0;right:0;border:2px solid #ffffff66;overflow:hidden;color:#fff}
.pk .lid{top:0;height:46px;border-radius:14px 14px 4px 4px;background:var(--pg);border-bottom:2px dashed #ffffffaa;transition:transform .55s cubic-bezier(.5,-0.3,.6,1),opacity .55s;z-index:2;display:grid;place-items:center;font-family:Rajdhani;font-weight:700;font-size:11px;letter-spacing:3px;color:#fffc}
.pk .bod{top:44px;bottom:0;border-radius:4px 4px 14px 14px;background:var(--pg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .6s .25s,opacity .6s .25s}
.pk .bod::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff44 45%,transparent 60%);background-size:250% 100%;animation:holo 2.6s linear infinite}
.pk .ic{font-size:64px;filter:drop-shadow(0 6px 12px #0008)}
.pk .wm{width:160px;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 3px 6px #0007)}
.pk .t2{font-size:11px;letter-spacing:1.5px;color:#fffc;font-weight:800;text-transform:uppercase;padding:0 12px}
.pk .t3{font-size:10px;color:#fff9}
.pk.torn{animation:none}
.pk.torn .lid{transform:translate(60px,-140px) rotate(35deg);opacity:0}
.pk.torn .bod{transform:translateY(120px) scale(.9);opacity:0}
.sum{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.sum span{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;background:var(--sunk)}
.sum .gd{border-color:var(--gold);color:var(--gold)}
.sum .nw{border-color:var(--ok);color:var(--ok)}
.sum .cp{border-color:var(--brand);color:var(--brand-ink)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.sp{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
.sp .ph{height:86px;border-radius:10px;background:var(--pg);display:grid;place-items:center;font-size:38px;border:1px solid #ffffff33}
.sp h4{font-family:Rajdhani;font-size:19px;line-height:1}
.sp p{font-size:12px;color:var(--mut);line-height:1.4;margin:0;text-align:left}
.sp .odds{display:flex;height:7px;border-radius:4px;overflow:hidden;gap:1px;margin:4px 0}
.sp .odds i{display:block;height:100%}
.sp .ol{font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 8px}
.sp button{margin-top:auto;padding:10px;border-radius:10px;background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--on-brand);font-weight:800;font-size:12px;letter-spacing:.5px}
.sp button:disabled{opacity:.4;cursor:default}
.sp select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px;font:inherit;font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.tbl td,.tbl th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.tbl th{color:var(--mut);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.vpbox{max-width:760px;padding:0;overflow:hidden}
.vpbox .mclose{margin:14px auto 16px}
@media(max-width:1100px){.layout{grid-template-columns:210px minmax(0,1fr)}.det{grid-column:1/-1;border:0;padding:0;position:static;max-width:380px;margin:0 auto}}
@media(max-width:720px){.layout{grid-template-columns:1fr;padding:12px}.cards{grid-template-columns:repeat(2,1fr)}.album{padding-left:34px}.pack{grid-template-columns:repeat(3,1fr);gap:8px}}
</style>

<div class="layout">
  <aside class="side">
    <h6>Minhas coleções</h6>
    <div id="cols"></div>
    <button class="ghost ib" onclick="openRank()" style="margin-top:6px"><i data-ic="ranking"></i>Ranking de colecionadores</button>
    <div class="tot">
      <h6>Cartas totais</h6>
      <div class="n"><span id="tn">0</span> <small>/ <span id="tt">0</span></small></div>
      <h6 style="margin-top:12px">Raridades</h6>
      <div class="rar" id="rar"></div>
    </div>
    <div class="wallet">
      <h6 style="margin:0 0 6px">Moedas</h6>
      <div class="c"><span id="coinIc"></span><span id="coins">0</span><small id="dupInfo"></small></div>
      <button class="ghost go ib" id="convBtn" onclick="convertAll()"><i data-ic="convert"></i>Converter repetidas</button>
      <button class="ghost go ib" onclick="openShop()"><i data-ic="shop"></i>Loja de pacotes</button>
      
    </div>
  </aside>

  <main class="album">
    <div class="page pg" id="pagina">
    <div class="marca" id="marca" aria-hidden="true"></div>

const PAGS=[];
function montarPags(){PAGS.length=0;COLLECTIONS.forEach((c,k)=>{const l=CARDS.filter(x=>x.ci===k);for(let i=0;i<l.length;i+=PER)PAGS.push({ci:k,pg:i/PER,l:l.slice(i,i+PER),todos:l})})}

function paginaHTML(gi,lado){

   <div class="grade">${P.l.map(x=>slotHTML(x,false).replace(`onclick="pick('${x.id}')"`,`onclick="pickMesa('${x.id}')"`)).join("")}</div>
   <div class="premio">${premioHTML(c,P.todos)}</div><span class="num-pg ${lado}">${gi+1}</span></div>`;

let esq=0,virando=false,focoAntes=null,viradaAtual=null;
// fechar/abrir/escolher no meio de uma virada termina a virada na hora (sem folha órfã nem página trocada pela metade)
const terminaVirada=()=>{if(viradaAtual)viradaAtual()};
const reduzMov=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function abertura(){
  $("ladoE").innerHTML=paginaHTML(esq,"e");$("ladoD").innerHTML=paginaHTML(esq+1,"d");
  $("mesaN").textContent=`Páginas ${esq+1}${esq+1<PAGS.length?" e "+(esq+2):""} de ${PAGS.length}`;
  $("btAnt").disabled=esq===0;$("btProx").disabled=esq+2>=PAGS.length;
}
function abrirMesa(){
  terminaVirada();
  const gi=Math.max(0,PAGS.findIndex(P=>P.ci===ci&&P.pg===page));esq=gi-gi%2;abertura();
  focoAntes=document.activeElement;$("mesa").hidden=false;document.body.classList.add("mesa-on");($("btProx").disabled?$("btFechar"):$("btProx")).focus();
}
function fecharMesa(){
  if($("mesa").hidden)return;terminaVirada();$("mesa").hidden=true;document.body.classList.remove("mesa-on");
  const P=PAGS[esq];if(P&&!PAGS.some(x=>x.ci===ci&&x.pg===page&&(PAGS.indexOf(x)===esq||PAGS.indexOf(x)===esq+1))){ci=P.ci;page=P.pg;renderAll()}
  (focoAntes&&focoAntes.isConnected?focoAntes:$("btExp")).focus();
}
function pickMesa(id){terminaVirada();const c=byId[id];$("mesa").hidden=true;document.body.classList.remove("mesa-on");ci=c.ci;page=Math.floor(c.i/PER);sel=id;renderAll();$("det").scrollIntoView({block:"nearest",behavior:reduzMov()?"auto":"smooth"});const b=document.querySelector("#cards .vaga.sel");b&&b.focus({preventScroll:true})}
// folha molinha: N tiras encadeadas; a tira k (contando da lombada) tem ângulo θk(p) e a ponta da folha vai na frente,
// então a página curva como papel fino. Cada tira mostra a sua fatia da página da frente e, no verso, a da próxima.
// Papel fino: mais tiras, atraso grande entre lombada e ponta, curvatura que cresce no meio da virada e, quando a folha
// deita, a ponta ainda dá uma "assentada" (sobe um pouco e desce) antes de parar.
const TIRAS=18,VIRA_MS=1150,ASSENTA_MS=420;
function virar(dir){
  if(virando)return;const novo=esq+2*dir;if(novo<0||novo>=PAGS.length)return;
  // movimento reduzido (ex.: "efeitos de animação" desligados no Windows): a folha ainda vira, mas inteira, rápida e sem dobrar
  const calmo=reduzMov(),N=calmo?1:TIRAS;
  virando=true;
  const W=$("ladoD").getBoundingClientRect().width,w=W/N;
  const frente=dir>0?paginaHTML(esq+1,"d"):paginaHTML(esq,"e"),verso=dir>0?paginaHTML(novo,"e"):paginaHTML(novo+1,"d");
  if(dir>0)$("ladoD").innerHTML=paginaHTML(novo+1,"d");else $("ladoE").innerHTML=paginaHTML(novo,"e");
  const m=document.createElement("div");m.className="mola "+(dir>0?"prox":"ant");m.setAttribute("aria-hidden","true");
  let pai=m;const tiras=[];
  for(let k=0;k<N;k++){
    const t=document.createElement("div");t.className="tira";t.style.width=(w+1.2)+"px";
    if(dir>0)t.style.left=(k?w:0)+"px";else t.style.right=(k?w:0)+"px";
    const xf=dir>0?k*w:W-(k+1)*w,xv=dir>0?W-(k+1)*w:k*w;
    t.innerHTML=`<div class="cara f"><div class="pgw" style="width:${W}px;left:${-xf}px">${frente}</div><i></i></div><div class="cara v" style="visibility:hidden"><div class="pgw" style="width:${W}px;left:${-xv}px">${verso}</div><i></i></div>`;
    pai.appendChild(t);tiras.push(t);pai=t;
  }
  $("livro").appendChild(m);
  viradaAtual=()=>{viradaAtual=null;esq=novo;m.remove();virando=false;if(!$("mesa").hidden)abertura()};
  // o contador já mostra as páginas de destino (antes só mudava no fim da animação)
  $("mesaN").textContent=`Páginas ${novo+1}${novo+1<PAGS.length?" e "+(novo+2):""} de ${PAGS.length}`;
  const dur=calmo?520:VIRA_MS,fim=calmo?0:ASSENTA_MS,atraso=calmo?0:.42,t0=performance.now(),s=dir>0?-1:1;
  const ease=x=>-(Math.cos(Math.PI*x)-1)/2; // seno: começa e termina macio
  const cl=(x,a,b)=>Math.min(b,Math.max(a,x));
  // posição da tira ao longo da folha (0 = lombada, 1 = ponta)
  const pos=k=>N>1?k/(N-1):1;
  const ang=(p,k)=>{
    if(p>=1)return 180;
    const r=pos(k),u=cl((p-atraso*(1-r))/(1-atraso),0,1);
    // curvatura extra: a ponta se adianta mais no meio da virada (papel fino "enrola") e volta a zero nas pontas do movimento
    return cl(180*ease(u)+(calmo?0:22*Math.sin(Math.PI*u)*r*r),0,180);
  };
  // assentada: depois de deitar, a ponta levanta alguns graus e desce amortecida (a lombada não mexe)
  const assenta=(q,k)=>{const r=pos(k);return 180-9*r*r*Math.sin(Math.PI*Math.min(1,q*1.6))*Math.exp(-3.2*q)};
  const sb=a=>Math.sin(a*Math.PI/180)*.22,g=(x,y)=>`linear-gradient(90deg,rgba(0,0,0,${x.toFixed(3)}),rgba(0,0,0,${y.toFixed(3)}))`;
  function quadro(agora){
    const tt=agora-t0,p=Math.min(1,tt/dur),q=fim?Math.min(1,Math.max(0,(tt-dur)/fim)):1;
    const angulo=k=>p<1?ang(p,k):assenta(q,k);
    let antes=0,sAnt=sb(angulo(0));
    tiras.forEach((t,k)=>{const a=angulo(k);t.style.transform=`rotateY(${s*(a-antes)}deg)`;antes=a;
      // o Safari do iPhone nem sempre respeita backface-visibility nas tiras encadeadas (o verso aparecia espelhado por cima):
      // aqui cada tira mostra só a cara que está virada para a gente, pelo ângulo total dela
      const vs=a>90;t.children[0].style.visibility=vs?"hidden":"visible";t.children[1].style.visibility=vs?"visible":"hidden";
      const sA=sAnt,sB=sb(a);sAnt=sB;const [fa,fb]=dir>0?[sA,sB]:[sB,sA];
      t.children[0].lastElementChild.style.background=g(fa,fb);t.children[1].lastElementChild.style.background=g(fb,fa)});
    if(!m.isConnected)return;if(tt<dur+fim)requestAnimationFrame(quadro);else viradaAtual&&viradaAtual()
  }
  requestAnimationFrame(quadro);
}
// arrastar no livro também vira a página
(()=>{let x0=null;const l=$("livro");l.addEventListener("pointerdown",e=>{x0=e.clientX});l.addEventListener("pointerup",e=>{if(x0==null)return;const d=e.clientX-x0;x0=null;if(Math.abs(d)>40)virar(d<0?1:-1)})})();

  const n=owned(c);
  $("det").innerHTML=`<div class="h"><b>${c.num}</b><span class="chipR" style="--rc:var(--${c.r})">⬢ ${c.r}</span></div>${cardHTML(c,{})}
  <h2>${escapeHtml(c.name)}</h2><p>${escapeHtml(c.desc||"")}</p>
  <div class="kv"><span>Coleção</span><b>${col.n}</b></div>
  <div class="kv"><span>Raridade</span><b style="color:var(--${c.r})">⬢ ${c.r}</b></div>${odds}
  ${c.meme?`<button class="play" onclick="watch('${c.meme}')"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="vertical-align:-2px"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg> ASSISTIR NO PLAYER DE ${c.y}</button>`:""}
  <button class="bigbtn" onclick="setFav()">${favId()===c.id?'★ É A SUA FAVORITA':'☆ DEFINIR COMO FAVORITA'}</button>
  ${n>1?`<button class="sm" style="color:var(--gold)" onclick="convertOne('${c.id}')">♻ CONVERTER AS REPETIDAS DESTA CARTA</button>`:""}
  <button class="shrbtn" onclick="share()"><span class="ci">${icon("share")}</span><span class="tx">Compartilhar no seu perfil<small>Vira um post no seu perfil</small></span><span class="chev" aria-hidden="true">›</span></button>
  <div class="copies">Você possui ${n} cópia${n>1?'s':''} desta carta</div>`;
}
const renderAll=()=>{renderCols();renderAlbum();renderDet()};

function copiarShare(){const t=textoShare(byId[sel]);try{navigator.clipboard.writeText(t).then(()=>toast("Texto copiado!"),()=>toast(t))}catch(e){toast(t)}}

   <label for="shrL">Legenda (opcional)</label><textarea id="shrL" maxlength="140" rows="3" placeholder="Escreva algo sobre essa figurinha…"></textarea><small id="shrN" aria-live="polite">140 caracteres restantes</small></div></div>
   <div class="shr-bt"><button type="button" class="mclose" id="shrOk">Publicar no meu perfil</button><button type="button" class="mclose ghost2" onclick="copiarShare()">Só copiar o texto</button></div>`,"shrbox");
  const t=$("shrL"),n=$("shrN");t.oninput=()=>{n.textContent=`${140-[...t.value].length} caracteres restantes`};
  $("shrOk").onclick=async()=>{const b=$("shrOk");b.disabled=true;

      const link="perfil.html?u="+encodeURIComponent(u.apelido);

    catch(e){b.disabled=false;toast((e&&e.erro)||"Não consegui publicar agora.")}};

function about(){const c=COLLECTIONS[ci];openModal(`<h3>${c.n}</h3><p>${c.about}</p><table class="tbl"><tr><th>Raridade</th><th>Cartas</th><th>Você tem</th></tr>${RARITIES.map(r=>{const l=CARDS.filter(x=>x.ci===ci&&x.r===r);return l.length?`<tr><td style="color:var(--${r})">⬢ ${r}</td><td>${l.length}</td><td>${l.filter(x=>owned(x)).length}</td></tr>`:""}).join("")}</table><p style="margin-top:12px">Completar a coleção rende um bônus de <b style="color:var(--gold)">moedas</b> e XP.</p><button class="mclose" onclick="closeModal()">FECHAR</button>`)}
function openModal(h,cls){$("mbox").className="mbox "+(cls||"");$("mbox").innerHTML=`<button class="xclose" onclick="closeModal()" aria-label="Fechar" title="Fechar (Esc)">${icon("xmark")}</button>`+h;$("modal").classList.add("open")}
let vpl=null;
// fim da revelação (todas viradas ou pacote fechado): só agora carteira, XP, patente e o álbum atrás aparecem
// devolve uma promessa que resolve quando carteira e álbum (do servidor) já foram desenhados
function settlePack(){

}

// ---- moedas: repetida vira moeda (o servidor converte e paga) ----
async function reciclarRepetidas(corpo){
  if(packOpen||abrindo)return;
  if(ECO.convidado)return avisoLogin("converter repetidas");
  try{
    const r=await Api.reciclar(corpo);
    toast(`+${fmt(r.moedas_ganhas)} 🪙 (${r.convertidas} repetida${r.convertidas>1?"s":""} convertida${r.convertidas>1?"s":""})`);
  }catch(e){
    if(e.status===409)toast(e.erro||"Você não tem repetidas para converter");
    else if(e.status===0)toast("Sem conexão. Tente de novo.");
    else if(e.status===400||e.status===404)toast(e.erro||"Não foi possível converter");
  }
  try{await Promise.all([atualizarCarteira(),carregarAlbum()])}catch(e){}
  renderWallet();renderAll();
}

const invCount=()=>(ECO.pacotes||[]).reduce((n,p)=>n+p.quantidade,0);
function renderFab(){
  const n=invCount(),f=$("pfab");if(!f)return;
  if(ECO.convidado){f.classList.add("empty");f.innerHTML=`<span class="pf-pack"><span class="pf-crimp"></span>${icon("pack")}<span class="pf-crimp b"></span></span><span class="pf-t"><b>Entre para jogar</b><small>álbum, moedas e pacotes precisam de conta</small></span>`;return}
  f.classList.toggle("empty",!n);
  f.innerHTML=`<span class="pf-pack"><span class="pf-crimp"></span>${icon("pack")}<span class="pf-crimp b"></span></span>
   <span class="pf-t"><b>${n?"Abrir pacote":"Sem pacotes"}</b><small>${n?`${n} ${n>1?"pacotes esperando":"pacote esperando"}`:"Próximo grátis amanhã · ver loja"}</small></span>${n?`<span class="pf-n">${n}</span>`:""}`;
}
function bumpFab(){const f=$("pfab");f.classList.remove("bump");void f.offsetWidth;f.classList.add("bump")}
function packFab(){

  if(!economiaPronta()){if(ECO.indisponivel)iniciarEconomia();return}
  if(!invCount())return openShop();

}
function openInv(){
  const arg=p=>escapeHtml(JSON.stringify(p.tipo))+","+escapeHtml(JSON.stringify(p.colecao_id||null));
  openModal(`<div class="inv-h"><h3>Seus pacotes</h3><p>${invCount()} pacote${invCount()>1?"s":""} fechado${invCount()>1?"s":""}. Escolha qual rasgar.</p></div>
  <div class="inv">${ECO.pacotes.map(p=>{const a=artDe(p.tipo,p.nome),col=p.colecao_id&&COLLECTIONS.find(c=>c.id===p.colecao_id);return`<button class="inv-i" onclick="abrirTipo(${arg(p)})">${packArt(a,p.colecao_id,true)}<b>${escapeHtml(a.name)}</b><small>${col?escapeHtml(col.n):a.guar?"Garante "+escapeHtml(a.guar)+" ou melhor":"Todas as coleções"}</small>${p.quantidade>1?`<span class="inv-n">x${p.quantidade}</span>`:""}</button>`}).join("")}</div>
  ${ECO.pacotes.length>1||ECO.pacotes[0].quantidade>1?`<button class="mclose ghost2" onclick="abrirTipo(${arg(ECO.pacotes[0])})">Abrir o primeiro</button>`:""}`,"invbox");

async function buyPack(id){
  const p=TIPO(id);if(!p)return;

  try{await Api.comprar({tipo:id,colecao_id:colId})}

function packArt(a,colecaoId,mini){
  const col=colecaoId&&COLLECTIONS.find(c=>c.id===colecaoId),colName=col?col.n:"Todas as coleções";
  return `<div class="pk${mini?" mini":""}" style="--pg:${escapeHtml(a.pg)}"><div class="lid"><span>rasgue aqui</span></div><div class="bod"><div class="pk-ray"></div><div class="ic">${icon(a.ic)}</div><img class="wm" src="logo-word.png" alt="Não Salvo" width="380" height="73"><div class="t2">${escapeHtml(a.name)}</div><div class="t3">${escapeHtml(colName)} · ${a.cartas} cartas</div></div></div>`;

// abrir = o servidor sorteia, grava e credita tudo; aqui só se anima o resultado que ele devolveu.
// ANTI-SPOILER: a carteira e o álbum só são buscados depois da última carta virada (ou do pacote fechado).
let abrindo=false;
async function abrirTipo(tipo,colecaoId){
  if(abrindo||packOpen)return;
  if(ECO.convidado)return avisoLogin("abrir pacotes");
  abrindo=true;holdWallet(true);
  let r;
  try{r=await Api.abrir({tipo,colecao_id:colecaoId||null})}
  catch(e){
    abrindo=false;walletHold=false;
    if(e.status===0)toast("Sem conexão. Tente de novo.");
    else if(e.status===404||e.status===409){toast(e.erro||"Pacote não encontrado no seu estoque");try{await atualizarCarteira()}catch(_){}renderAll()}
    else if(![401,402,429,503].includes(e.status))toast(e.erro||"Não foi possível abrir o pacote");
    renderWallet();return;
  }
  abrindo=false;mostrarPacote(r,colecaoId||null);
}
function mostrarPacote(r,colecaoId){
  const a=artDe(r.tipo,r.nome);
  const got=(r.cartas||[]).map(x=>{const c=byId[x.id]||{id:x.id,name:x.nome,e:x.emoji,r:x.raridade,ci:Math.max(0,COLLECTIONS.findIndex(k=>k.id===x.colecao_id)),num:"???"};return{c,isNew:!!x.nova}});
  const done=(r.colecoes_completas||[]).map(id=>COLLECTIONS.find(k=>k.id===id)).filter(Boolean);
  const nNew=typeof r.novas==="number"?r.novas:got.filter(g=>g.isNew).length,dupVal=r.valor_das_repetidas||0;
  packOpen=true;
  openModal(`<div class="stage-rays"></div><div class="pk-head"><h3>${escapeHtml(a.name)}</h3><p id="pkP">Clique no pacote para rasgar</p></div>
   <div class="pk-wrap" id="pkW" onclick="tear(this.firstElementChild)">${packArt(a,colecaoId)}</div>
   <div id="pkC" style="display:none"><div class="pack">${got.map((g,i)=>{const ri=RARITIES.indexOf(g.c.r);return`<div class="slot" style="--d:${i*110}ms;--rc:var(--${g.c.r})">${g.isNew?'<span class="new">NOVA!</span>':''}<div class="flip r${ri}" onclick="flipOne(this)"><div class="back ${ri>=3?'glow':''}"><img src="logo-word.png" alt=""><span>${icon("star")}</span></div><div class="front">${cardHTML(g.c,{force:true})}</div></div></div>`}).join("")}</div>
   <div class="sum" id="pkS" style="visibility:hidden"><span class="nw">${icon("new")}${nNew} nova${nNew!==1?"s":""}</span><span class="cp">+${fmt(r.xp_ganho||0)} XP</span>${dupVal?`<span class="gd">${icon("convert")}repetidas valem ${fmt(dupVal)} moedas (converta no álbum)</span>`:""}${done.map(c=>`<span class="gd">${icon("ranking")}${escapeHtml(c.n)} completa!${done.length===1&&r.moedas_ganhas?` +${fmt(r.moedas_ganhas)} moedas`:""}</span>`).join("")}</div>
   <div class="pk-btns"><button class="mclose" id="pkB" onclick="revealAll(this)">Revelar tudo</button></div></div>`,"pkstage");
}
function tear(el){if(!el||!el.isConnected||el.classList.contains("torn"))return;el.classList.add("torn");burst($("pkW"),"#fff",26);$("pkP").textContent="Toque nas cartas para revelar. As que brilham são Relíquia ou melhor";setTimeout(()=>{const w=$("pkW"),c=$("pkC");if(w&&c){w.style.display="none";c.style.display="block"}},700)}
function burst(host,color,n){if(!host||!host.isConnected)return;const r=host.getBoundingClientRect(),box=$("mbox").getBoundingClientRect();for(let i=0;i<n;i++){const s=document.createElement("i");s.className="spark";const a=Math.random()*Math.PI*2,d=80+Math.random()*160;s.style.cssText=`left:${r.left-box.left+r.width/2}px;top:${r.top-box.top+r.height/2}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;background:${color};animation-delay:${Math.random()*80}ms`;$("mbox").appendChild(s);setTimeout(()=>s.remove(),1000)}}
function flipOne(el){if(!el||!el.isConnected||el.classList.contains("f"))return;el.classList.add("f");el.parentElement.classList.add("rev");const ri=+el.className.match(/r(\d)/)[1];if(ri>=3)burst(el,getComputedStyle(el.parentElement).getPropertyValue("--rc")||"#fff",ri*6);checkAll()}
function checkAll(){const s=$("pkS"),b=$("pkB");if(!s||!b)return;const f=[...document.querySelectorAll(".flip")];if(f.every(x=>x.classList.contains("f"))){const p=settlePack();s.style.visibility="visible";b.textContent="Guardar no álbum";
  Promise.resolve(p).then(()=>{const bb=$("pkB");if(bb&&invCount()&&!$("pkN"))bb.insertAdjacentHTML("afterend",`<button class="mclose alt" id="pkN" onclick="closeModal();packFab()">Abrir o próximo (${invCount()})</button>`)})}}
function revealAll(b){const f=[...document.querySelectorAll(".flip")];if(f.every(x=>x.classList.contains("f"))){closeModal();return}f.forEach((x,i)=>setTimeout(()=>flipOne(x),i*260))}

async function openShop(){
  if(ECO.convidado)return avisoLogin("comprar pacotes");

  const bar=o=>{o=o||{};return `<div class="odds">${RARITIES.map(r=>o[r]?`<i style="width:${o[r]}%;background:var(--${r})" title="${r} ${o[r]}%"></i>`:"").join("")}</div><div class="ol">${RARITIES.filter(r=>o[r]).map(r=>`<span style="color:var(--${r})">${r} ${o[r]}%</span>`).join("")}</div>`};
  openModal(`<h3>Loja de pacotes</h3><p>Você tem <b style="color:var(--gold)">🪙 ${fmt(ECO.moedas)}</b>${dupsTotal()?` e mais <b style="color:var(--gold)">🪙 ${fmt(dupsTotal())}</b> em repetidas para converter`:""}. Cada pacote vai pro seu estoque, para abrir quando quiser.</p>
  <div class="shop">${lojaTipos.map(p=>`<div class="sp" style="--pg:${escapeHtml(p.gradiente||GRAD_PADRAO)}"><div class="ph">${icon(p.icone||"pack")}</div><h4>${escapeHtml(p.nome)}</h4><p>${escapeHtml(p.descricao||"")}</p>
   ${p.escopo==="colecao"?`<select id="shopCol">${COLLECTIONS.map((c,k)=>`<option value="${escapeHtml(c.id)}" ${k===ci?"selected":""}>${escapeHtml(c.n)}</option>`).join("")}</select>`:""}
   ${bar(p.chances)}<button ${ECO.moedas<p.preco?"disabled":""} onclick="buyPack(${escapeHtml(JSON.stringify(p.id))})">${icon("coin")}Comprar · ${fmt(p.preco)}</button></div>`).join("")}</div>
  <table class="tbl"><tr><th>Como ganhar moedas</th></tr>
   <tr><td>Converter cartas repetidas (sempre fica 1 de cada)</td></tr><tr><td>Completar uma coleção</td></tr></table>
  <div style="display:flex;gap:10px;justify-content:center"><button class="mclose" style="margin:16px 0 0" onclick="closeModal()">FECHAR</button>${dupsTotal()?`<button class="mclose" style="margin:16px 0 0;background:var(--sunk);color:var(--gold);box-shadow:none;border:1px solid var(--gold)" onclick="convertAll().then(openShop)">♻ CONVERTER REPETIDAS</button>`:""}</div>`);
}

document.addEventListener("keydown",e=>{
  if(!$("mesa").hidden){ // álbum expandido: setas viram, Esc fecha, Tab fica dentro da mesa
    if(e.key==="Escape"){e.preventDefault();fecharMesa()}else if(e.key==="ArrowRight"){e.preventDefault();virar(1)}else if(e.key==="ArrowLeft"){e.preventDefault();virar(-1)}
    else if(e.key==="Tab"){const f=[...$("mesa").querySelectorAll("button:not([disabled])")].filter(b=>b.offsetParent);if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}}
    return}
  if(e.key==="Escape")closeModal();if(document.querySelector(".modal.open"))return;if(e.key==="ArrowRight")pg(page+1);if(e.key==="ArrowLeft")pg(page-1)});

// cartas do banco (painel): nome, emoji, raridade, meme e imagem; carta nova do painel entra no fim da coleção. Falhou: fica o data.js.
async function sincronizarCartas(){
  let d;try{const r=await fetch("/api/cartas",{credentials:"same-origin"});if(!r.ok)return false;d=await r.json()}catch(e){return false}
  if(!d||!Array.isArray(d.itens)||!d.itens.length)return false;
  let novas=false;
  for(const s of d.itens){
    const ci=COLLECTIONS.findIndex(k=>k.id===s.colecao_id);if(ci<0||!s.numero)continue;
    const i=s.numero-1,col=COLLECTIONS[ci];
    let c=CARDS.find(x=>x.ci===ci&&x.i===i);
    if(!c){
      if(i!==col.cards.length)continue;
      col.cards.push({name:s.nome,e:s.emoji||"❓",r:s.raridade});
      c={id:s.id,ci,i,num:String(i+1).padStart(3,"0"),...col.cards[i]};CARDS.push(c);byId[c.id]=c;novas=true;
    }
    c.name=s.nome;if(s.emoji)c.e=s.emoji;c.r=s.raridade;
    if(s.meme_id)c.meme=s.meme_id;else delete c.meme;
    if(s.imagem)c.img=s.imagem;else delete c.img;
    const m=c.meme&&MEMES.find(x=>x.id===c.meme);c.desc=m&&m.d?m.d:`${c.name}: ${col.about}`;
  }
  if(novas)montarPags();
  return true;
}
sincronizarCartas().then(ok=>{if(ok)renderAll()});
