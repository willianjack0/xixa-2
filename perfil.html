<script>
renderHeader("perfil",{sub:[
  {k:"inicio",ic:"home",label:"Início",href:"index.html"},
  {k:"tl",ic:"timeline",label:"Linha do tempo",href:"linha-do-tempo.html"},

  {k:"album",ic:"album",label:"Álbum de figurinhas",href:"album.html"},
  {sp:1},
  {k:"send",ic:"send",label:"Enviar meme",cta:1,href:"index.html#send"}
]});
renderWallet();

// ---- visuais do perfil: nomes e textos de cada rede (a interação é sempre um recado; o nome muda) ----
const LAYOUTS={
  homepage:{nome:"Home page anos 90",dica:"livro de visitas",cor:"linear-gradient(90deg,#008080,#ff00ff,#ffff00)",recados:"Livro de visitas",acao:"Assinar!!!",ph:()=>"Assine meu livro de visitas!!!",vazio:"Ninguém assinou ainda. Seja o primeiro!!!",ok:"Livro de visitas assinado!"},
  icq:{nome:"ICQ",dica:"uh-oh! mensagens",cor:"linear-gradient(90deg,#3a8ee6,#7ec850)",recados:"Mensagens recebidas",acao:"Enviar",ph:a=>`Mensagem para ${a}…`,vazio:"Nenhuma mensagem ainda.",ok:"Uh-oh! Mensagem enviada."},
  orkut:{nome:"Orkut",dica:"scraps e comunidades",cor:"linear-gradient(90deg,#c4006a,#bfd0ea)",recados:"Scraps",acao:"enviar scrap",ph:a=>`escreva um scrap para ${a}…`,vazio:"Ninguém deixou scrap ainda. Seja o primeiro!",ok:"Scrap enviado!"},
  fotolog:{nome:"Fotolog",dica:"livro de visitas",cor:"linear-gradient(90deg,#262626,#8cc63f)",recados:"livro de visitas",acao:"assinar",ph:()=>"assine o livro de visitas…",vazio:"Ninguém assinou o livro de visitas ainda.",ok:"Você assinou o livro de visitas!"},
  msn:{nome:"MSN",dica:"mensagens offline",cor:"linear-gradient(90deg,#1a6fc2,#4caf2a)",recados:"Mensagens offline",acao:"Enviar",ph:a=>`Digite uma mensagem para ${a}…`,vazio:"Nenhuma mensagem ainda. Mande um oi!",ok:"Mensagem enviada!"},
  twitter:{nome:"Twitter antigo",dica:"o do passarinho",cor:"linear-gradient(90deg,#33ccff,#c0deed)",recados:"Menções",acao:"Tweetar",ph:a=>`@${a} `,vazio:"Ninguém mencionou ainda.",ok:"Tweet enviado!"},
  facebook:{nome:"Facebook antigo",dica:"o mural azul",cor:"linear-gradient(90deg,#3b5998,#e9ebee)",recados:"Mural",acao:"Publicar",ph:a=>`Escreva algo para ${a}…`,vazio:"O mural está vazio. Escreva algo!",ok:"Publicado no mural!"},
  ask:{nome:"Ask.fm",dica:"perguntas e respostas",cor:"linear-gradient(90deg,#1679a0,#d0353e)",recados:"Perguntas",acao:"Perguntar",ph:a=>`Pergunte algo para ${a}…`,vazio:"Ninguém perguntou nada ainda.",ok:"Pergunta enviada!"},
  whatsapp:{nome:"WhatsApp",dica:"conversa no zap",cor:"linear-gradient(90deg,#075e54,#dcf8c6)",recados:"Conversa",acao:"Enviar",ph:()=>"Mensagem",vazio:"Nenhuma mensagem ainda. Mande um oi!",ok:"Mensagem enviada ✔✔"},
  vine:{nome:"Vine",dica:"6 segundos em loop",cor:"linear-gradient(90deg,#00805d,#e1f4ed)",recados:"Comentários",acao:"Comentar",ph:()=>"Adicione um comentário…",vazio:"Nenhum comentário ainda.",ok:"Comentário enviado!",mod:1,st:["figurinhas","coleções","loops"]},
  snapchat:{nome:"Snapchat",dica:"stories e filtros",cor:"linear-gradient(90deg,#fffc00,#9b4dca)",recados:"Chat",acao:"Enviar",ph:()=>"Enviar um chat",vazio:"Nenhum chat ainda.",ok:"Chat enviado!",mod:1,st:["figurinhas","coleções","snapscore"]},
  instagram:{nome:"Instagram antigo",dica:"o das fotos quadradas",cor:"linear-gradient(90deg,#f09433,#dc2743,#bc1888)",recados:"Comentários",acao:"Publicar",ph:()=>"Adicione um comentário…",vazio:"Nenhum comentário ainda.",ok:"Comentário publicado!",mod:1,st:["publicações","coleções","XP"]},
  tiktok:{nome:"TikTok",dica:"vídeo curto",cor:"linear-gradient(90deg,#25f4ee,#000,#fe2c55)",recados:"Comentários",acao:"Postar",ph:()=>"Adicionar comentário…",vazio:"Seja o primeiro a comentar!",ok:"Comentário postado!",mod:1,st:["figurinhas","coleções","curtidas"]}
};
// como as publicações (figurinha compartilhada do álbum, meme aprovado) aparecem em cada rede
const PUB={homepage:["Minhas fotos","foto"],icq:["Arquivos enviados","arquivo"],orkut:["Fotos","foto"],fotolog:["fotos postadas","foto"],msn:["Compartilhados","compartilhamento"],twitter:["Tweets","tweet"],facebook:["Publicações","publicação"],ask:["Respostas","resposta"],whatsapp:["Status","status"],vine:["Vines","vine"],snapchat:["Minha story","story"],instagram:["Fotos","foto"],tiktok:["Vídeos","vídeo"]};
const MAX=300;
const $=id=>document.getElementById(id);
const esc=v=>escapeHtml(String(v??""));
const RORD=["Mítico","Lendário","Relíquia","Raro","Relevante","Comum"];
let P=null,REC=[],ALVO="",MOSTRAR_TODAS=false;

const params=new URLSearchParams(location.search);
const pedido=(params.get("u")||"").trim();

function avisar(t){const a=$("aviso");a.textContent="";setTimeout(()=>a.textContent=t,30)}
// a foto do perfil é sempre o gatinho (se o gato não for válido, a inicial)
function gato(o,ap,cls){return gatoValido(o)?`<span class="${cls||"pf-gato"}" role="img" aria-label="Gatinho de ${esc(ap)}">${catSVG(o)}</span>`:`<span class="${cls||"pf-gato"} ini" aria-hidden="true">${esc(String(ap||"?").charAt(0).toUpperCase())}</span>`}
const linkPerfil=ap=>`perfil.html?u=${encodeURIComponent(ap)}`;
const dataBR=d=>{const x=new Date(d);return isNaN(x)?"":x.toLocaleDateString("pt-BR")};
const quando=d=>{const x=new Date(d);if(isNaN(x))return"";const s=(Date.now()-x)/1000;if(s<60)return"agora";if(s<3600)return`há ${Math.floor(s/60)} min`;if(s<86400)return`há ${Math.floor(s/3600)} h`;return x.toLocaleDateString("pt-BR")};
// arte: imagem enviada no painel (carta ou meme) > imagem do meme no acervo > miniatura do vídeo
const caminhoImg=p=>p?"/"+String(p).replace(/^\/+/,""):"";
const THUMB_YT=y=>`https://i.ytimg.com/vi/${y}/mqdefault.jpg`;
function urlArte(imagem,meme,yt){
  if(imagem)return caminhoImg(imagem);
  if(meme&&meme.img)return caminhoImg(meme.img);
  const y=yt||(meme&&meme.yt);return y&&/^[A-Za-z0-9_-]{11}$/.test(y)?THUMB_YT(y):"";
}
function colecao(id){return (typeof COLLECTIONS!=="undefined"&&COLLECTIONS.find(c=>c.id===id))||null}
function carta(c,grande){
  const col=colecao(c.colecao_id),bg=col?col.bg:["#334","#112"],m=c.meme_id&&typeof MEMES!=="undefined"&&MEMES.find(x=>x.id===c.meme_id);
  const ua=urlArte(c.imagem,m),img=ua?`<img src="${esc(ua)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="var e=this.nextElementSibling;if(e)e.hidden=false;this.remove()">`:"";
  return `<div class="pf-carta ${grande?"grande ":""}${esc(c.raridade)}" style="--rc:var(--${esc(c.raridade)})" role="img" aria-label="Carta ${esc(c.nome)}, ${esc(c.raridade)}">
   <div class="tp"><span>${String(c.numero).padStart(3,"0")}</span><em>${esc(c.raridade)}</em></div>
   <div class="art" style="background:linear-gradient(150deg,${esc(bg[0])},${esc(bg[1])})">${img}<span${img?" hidden":""}>${esc(c.emoji||"⭐")}</span></div>
   <div class="nm">${esc(c.nome)}</div><div class="ft">${esc(col?col.n:c.colecao_id)}</div></div>`;
}
function favHTML(){
  const eu=P.perfil.eh_meu;
  if(!P.carta_favorita)return eu?`<button type="button" class="pf-semfav" data-ed="fav">${icon("edit")}<span>Escolher a minha carta favorita</span></button>`:`<div class="pf-semfav">Ainda sem carta favorita.</div>`;
  return eu?`<div class="pf-edw pf-edw-fav">${carta(P.carta_favorita,true)}${lapis("fav","Trocar a carta favorita")}</div>`:carta(P.carta_favorita,true)}
// lápis de edição (só para o dono do perfil)
const lapis=(k,t)=>`<button type="button" class="pf-lapis" data-ed="${k}" title="${esc(t)}" aria-label="${esc(t)}">${icon("edit")}</button>`;
// foto do perfil (gatinho) com o lápis no cantinho para o dono
function fotoPerfil(p){const g=gato(p.avatar_gato,p.apelido);return p.eh_meu?`<span class="pf-edw pf-edw-av">${g}${lapis("gato","Editar gatinho e apelido")}</span>`:g}
function patHTML(){
  const p=P.patente,cor=p&&/^#[0-9a-f]{3,8}$/i.test(p.cor||"")?p.cor:"#0a6a9a",prox=P.proxima_patente;
  const pct=prox?Math.max(4,Math.min(100,Math.round(P.xp/(P.xp+prox.faltam)*100))):100;
  return `<div style="--pc:${cor}">${p?`<span class="pf-pat">⬢ ${esc(p.nome)}</span>`:""}<div class="pf-xp" role="progressbar" aria-label="Nível" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
   <div class="pf-cap">${fmt(P.xp)} XP${prox?` · faltam ${fmt(prox.faltam)} para ${esc(prox.nome)}`:" · patente máxima"}</div></div>`;
}
function colsHTML(){return `<div class="pf-cols">${P.album.colecoes.map(k=>{const c=colecao(k.id),pct=k.total?Math.round(k.tenho/k.total*100):0;
  return `<div class="pf-col" style="--cc:${esc(c?c.c:"#0a6a9a")}"><span class="ic" aria-hidden="true">${esc(c?c.ic:"📒")}</span><span><b>${esc(k.nome)}${k.completa?" ✔":""}</b><span class="br"><i style="width:${pct}%"></i></span></span><small>${k.tenho}/${k.total}</small></div>`}).join("")}</div>`}
function figsHTML(max,fn){fn=fn||(c=>carta(c));
  const l=P.album.cartas.slice().sort((a,b)=>RORD.indexOf(a.raridade)-RORD.indexOf(b.raridade)||String(a.id).localeCompare(String(b.id)));
  if(!l.length)return `<p class="pf-vazio">${P.perfil.eh_meu?"Você ainda não tem figurinhas. Abra um pacote no álbum!":"Ainda sem figurinhas."}</p>`;
  const n=MOSTRAR_TODAS?l.length:Math.min(max,l.length);
  return `<div class="pf-figs">${l.slice(0,n).map(fn).join("")}</div>${l.length>n?`<button type="button" class="pf-bt pf-mais" data-todas>Ver todas as ${l.length} figurinhas</button>`:""}`;
}
function recadosHTML(L){
  const ap=P.perfil.apelido,eu=P.perfil.eh_meu,tw=P.perfil.layout==="twitter";
  const form=eu?"":`<form class="pf-form" id="rcF" novalidate>${tw?`<label class="q" for="rcT">O que você quer dizer para @${esc(ap)}?</label>`:`<label class="sr-only" for="rcT">${esc(L.ph(ap))}</label>`}
    <textarea id="rcT" maxlength="${MAX}" placeholder="${esc(L.ph(ap))}" required></textarea>
    <div class="ln"><small id="rcN" aria-live="polite">${MAX} caracteres restantes</small><button type="submit" id="rcB">${esc(L.acao)}</button></div></form>`;
  const lista=REC.length?`<ul class="pf-rcs">${REC.map(r=>`<li class="pf-rc">${gato(r.autor.avatar_gato,r.autor.apelido,"pf-mini")}<div>
     <div class="qm"><a href="${linkPerfil(r.autor.apelido)}">${esc(r.autor.apelido)}</a><time datetime="${esc(r.em)}">${esc(quando(r.em))}</time>${r.pode_apagar?`<button type="button" class="ap" data-apagar="${esc(r.id)}" aria-label="Apagar recado de ${esc(r.autor.apelido)}">apagar</button>`:""}</div>
     <p>${tw?`<span class="ar">@${esc(ap)}</span> `:""}${esc(r.texto)}</p>${rodRec(r)}</div></li>`).join("")}</ul>`:`<p class="pf-vazio">${esc(eu?"Quando alguém deixar um recado, ele aparece aqui.":L.vazio)}</p>`;
  return form+lista;
}

// rodapé de cada recado, no jeito da rede
function rodRec(r){const l=P.perfil.layout,q=esc(quando(r.em));
  return {facebook:`<div class="rod">Curtir · Comentar · ${q}</div>`,whatsapp:`<div class="rod">${esc(new Date(r.em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}))} ✔✔</div>`,
   instagram:`<div class="rod">Curtir · Responder</div>`,tiktok:`<div class="rod">Responder · ♡</div>`,vine:`<div class="rod">🔁 revine</div>`,
   ask:`<div class="rod">👍 Curtir</div>`,icq:`<div class="rod">uh-oh!</div>`}[l]||""}
// um detalhe típico de cada rede moderna (sem logos, sem som, humor do site); a animação é só CSS e some com prefers-reduced-motion
function detalheHTML(p,a,nRec){
  const ap=esc(p.apelido),L=p.layout,autor=REC.length?esc(REC[0].autor.apelido):"alguém";
  const dias=Math.max(1,Math.floor((Date.now()-new Date(p.membro_desde))/864e5)+1||1);
  const f={
    vine:()=>`<span class="loop" aria-hidden="true"><i></i></span><span>↻ 6 segundos em loop. Pode repetir à vontade.</span>`,
    snapchat:()=>`<span class="chama" aria-hidden="true">🔥</span><span>${dias} dia${dias===1?"":"s"} de sequência. Não deixe a chama apagar!</span>`,
    instagram:()=>`<span class="cora" aria-hidden="true">♥</span><span>Curtido por <b>${autor}</b> e outras <b>${a.tenho*3+nRec}</b> pessoas que só olharam</span>`,
    tiktok:()=>`<span class="som"><span class="trilho"><span>♫ som original · ${ap} · com chiado de conexão discada</span><span aria-hidden="true">♫ som original · ${ap} · com chiado de conexão discada</span></span></span>`
  }[L];
  return f?`<div class="det det-${L}">${f()}</div>`:"";
}
// ---- publicações: figurinhas compartilhadas do álbum e memes aprovados, no jeito de cada rede ----
const PUBS=()=>(P&&Array.isArray(P.publicacoes)?P.publicacoes:[]);
function midia(m){const g=m&&m.id&&typeof MEMES!=="undefined"?MEMES.find(z=>z.id===m.id):null,u=m?urlArte(m.imagem,g,m.youtube_id):"";return u?`<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}
// quadradinho (grade do Instagram, story do Snapchat): figurinha ou meme como foto
function quadro(x,cls){
  if(x.tipo==="meme"){const m=x.meme||{};return `<a class="${cls}" ${m.id?`href="memepedia.html#${encodeURIComponent(m.id)}"`:""} style="--qbg:linear-gradient(150deg,#3f729b,#1c3f5e)">${midia(m)}<span class="em" aria-hidden="true">${esc(m.emoji||"🎬")}</span><span class="lg"><b>${esc(m.titulo||"Meme")}</b>${m.ano?` · ${esc(m.ano)}`:""}</span></a>`}
  const c=x.carta||x,col=colecao(c.colecao_id),bg=col?col.bg:["#334","#112"],mm=c.meme_id&&typeof MEMES!=="undefined"&&MEMES.find(z=>z.id===c.meme_id);
  return `<span class="${cls} r-${esc(c.raridade)}" style="--qbg:linear-gradient(150deg,${esc(bg[0])},${esc(bg[1])});--rc:var(--${esc(c.raridade)})" role="img" aria-label="Figurinha ${esc(c.nome)}, ${esc(c.raridade)}">${(ua=>ua?`<img src="${esc(ua)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:"")(urlArte(c.imagem,mm))}<span class="em" aria-hidden="true">${esc(c.emoji||"⭐")}</span><span class="lg"><b>${esc(c.nome)}</b></span></span>`
}
// rodapé de cada publicação, no jeito da rede (texto decorativo, sem botões falsos)
const RODPUB={orkut:"comentários (0)",fotolog:"0 comentários · livro de visitas",twitter:"↩ Responder · ⟲ Retweetar · ★ Favoritar",facebook:"Curtir · Comentar · Compartilhar",instagram:"♥ curtir · 💬 comentar",whatsapp:"✔✔ visualizado",vine:"🔁 loops · revine",snapchat:"👀 vista",tiktok:"♡ · 💬 · ↗",msn:"(Y) curtiu",icq:"uh-oh! arquivo recebido",ask:"👍 Curtir",homepage:"✨ NOVO! ✨"};
function postHTML(x,lay){
  const ap=esc(P.perfil.apelido),q=esc(quando(x.em)),fig=x.tipo==="figurinha",c=fig?x.carta:null,m=x.meme||{};
  const txt=x.legenda?esc(x.legenda):fig?`Consegui a figurinha <b>${esc(c.nome)}</b> (${esc(c.raridade)}) no álbum!`:`Meu meme <b>${esc(m.titulo||"")}</b>${m.ano?` (${esc(m.ano)})`:""} foi aprovado no acervo!`;
  const mid=fig?`<div class="pmid">${carta(c)}</div>`:`<${m.id?`a href="memepedia.html#${encodeURIComponent(m.id)}"`:"div"} class="pmid pmeme">${midia(m)||`<span class="em" aria-hidden="true">${esc(m.emoji||"🎬")}</span>`}<span><b>${esc(m.titulo||"Meme")}</b>${m.id?"<small>Ver na Memepédia</small>":""}</span></${m.id?"a":"div"}>`;
  return `<article class="pf-post"><header class="ph">${gato(P.perfil.avatar_gato,P.perfil.apelido,"pf-mini")}<div><b>${ap}</b>${lay==="twitter"?` <span class="ar">@${ap}</span>`:""}<time datetime="${esc(x.em)}">${q}</time></div>${x.pode_apagar?`<button type="button" class="ap" data-apub="${esc(x.id)}" aria-label="Apagar publicação">apagar</button>`:""}</header>
   <p class="ptx">${txt}</p>${mid}<footer class="prod" aria-hidden="true">${esc(RODPUB[lay]||"")}</footer></article>`;
}
function postsHTML(lay){
  const l=PUBS(),eu=P.perfil.eh_meu,[tit,um]=PUB[lay]||PUB.orkut;
  if(!l.length)return eu?`<div class="pf-box pf-posts"><h2 class="pf-h">${esc(tit)}</h2><p class="pf-vazio">Compartilhe uma figurinha no <a href="album.html">álbum</a> e ela aparece aqui como ${esc(um==="publicação"?"uma publicação":um==="story"?"uma story":"um "+um)}. Seus memes aprovados também.</p></div>`:"";
  return `<div class="pf-box pf-posts"><h2 class="pf-h">${esc(tit)} (${l.length})</h2><div class="pf-feed">${l.map(x=>postHTML(x,lay)).join("")}</div></div>`;
}

const SORTES=["Hoje é um bom dia para abrir um pacote.","Uma figurinha rara está mais perto do que parece.","Alguém vai deixar um scrap pra você.","Evite discutir com quem diz que o vestido é branco e dourado.","Hoje vale a pena visitar a linha do tempo.","Sua próxima carta pode ser Mítica. Ou não."];
function sorte(ap){let h=new Date().toDateString().length;for(const c of String(ap))h=(h*31+c.charCodeAt(0))>>>0;return SORTES[h%SORTES.length]}

function ligar(L){
  const el=$("pf");
  el.querySelectorAll(".abas a").forEach(t=>t.onclick=ev=>{ev.preventDefault();el.querySelectorAll(".abas a").forEach(o=>o.removeAttribute("aria-current"));t.setAttribute("aria-current","location");const x=$(t.dataset.ir);if(x)x.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})});
  const b=el.querySelector("[data-todas]");if(b)b.onclick=()=>{MOSTRAR_TODAS=true;montar();avisar("Mostrando todas as figurinhas")};
  el.querySelectorAll("[data-apagar]").forEach(x=>x.onclick=()=>apagar(x.dataset.apagar));
  el.querySelectorAll("[data-apub]").forEach(x=>x.onclick=()=>apagarPub(x.dataset.apub));
  const f=$("rcF");if(!f)return;
  const t=$("rcT"),n=$("rcN");
  t.oninput=()=>{const r=MAX-[...t.value].length;n.textContent=`${r} caracteres restantes`};
  f.onsubmit=async ev=>{ev.preventDefault();const texto=t.value.trim();if(!texto){t.focus();toast("Escreva alguma coisa.");return}
    const bt=$("rcB");bt.disabled=true;
    try{const r=await Api.recadar(P.perfil.apelido,texto);REC.unshift(r);P.recados++;toast(L.ok);montar();avisar(L.ok);const nt=$("rcT");nt&&nt.focus()}
    catch(e){bt.disabled=false;if(e&&e.status&&e.status!==429)toast(e.erro||"Não consegui enviar agora.")}};
}
async function apagar(id){

  try{await Api.apagarRecado(id);REC=REC.filter(r=>String(r.id)!==String(id));montar();toast("Recado apagado.");avisar("Recado apagado")}
  catch(e){toast((e&&e.erro)||"Não consegui apagar agora.")}
}
async function apagarPub(id){

// confirmação sem diálogo do navegador (que trava a página): 2 cliques em 4 s
let confirmT=0;function confirmar(){const a=Date.now();if(a-confirmT<4000){confirmT=0;return true}confirmT=a;toast("Clique de novo em “apagar” para confirmar.",3500);return false}

function barra(){
  const b=$("barra");if(!P){b.innerHTML="";return}
  const eu=P.perfil.eh_meu,lay=LAYOUTS[P.perfil.layout]?P.perfil.layout:"orkut";
  b.innerHTML=`<div class="pf-tools t-${lay}"><button type="button" class="pf-tb" id="btCopiar" aria-live="polite">${icon("link")}<span>Copiar link</span></button>${eu?`<button type="button" class="pf-tb" data-ed="visual" title="Trocar o visual do perfil">${icon("edit")}<span>Trocar visual</span></button>`:""}</div>`;

}
// endereço completo do perfil (funciona em qualquer pasta do site)
const urlPerfil=ap=>new URL(linkPerfil(ap),location.href).href;
async function copiarLink(){
  const u=urlPerfil(P.perfil.apelido),bt=$("btCopiar");
  let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(u);ok=true}}catch(e){}
  if(!ok){ // reserva: copia por um campo escondido (navegadores sem a API de área de transferência)
    const t=document.createElement("textarea");t.value=u;t.setAttribute("readonly","");t.style.cssText="position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(t);t.select();t.setSelectionRange(0,u.length);try{ok=document.execCommand("copy")}catch(e){}t.remove()}
  if(ok){toast("Link do perfil copiado!");avisar("Link do perfil copiado");if(bt){bt.classList.add("ok");bt.innerHTML=`${icon("check")}<span>Link copiado!</span>`;clearTimeout(bt._t);bt._t=setTimeout(()=>{bt.classList.remove("ok");bt.innerHTML=`${icon("link")}<span>Copiar link</span>`},2200)}}
  else{toast("Não deu para copiar sozinho. Copie o link: "+u,8000);avisar("Não deu para copiar. O link está na tela.")}
}
// lápis e botões de edição (delegação: o perfil é redesenhado a cada mudança)

    const l=document.querySelector(".pf-lapis[data-ed=gato]")||document.querySelector("#pf h1");if(l){if(!l.matches("button"))l.tabIndex=-1;l.focus()}})}
function abrirEdicao(foco){

  const av=gatoValido(p.avatar_gato)?catSVG(p.avatar_gato):"";

  const l=P.album.cartas.slice().sort((a,b)=>RORD.indexOf(a.raridade)-RORD.indexOf(b.raridade)||a.nome.localeCompare(b.nome));
  // carta favorita: fileira de mini-cartas (radiogroup); "Nenhuma" primeiro
  const fid=P.carta_favorita?P.carta_favorita.id:"";
  $("fav").innerHTML=l.length?`<label class="pf-fav nenhuma"><input type="radio" name="fav" value="" ${fid?"":"checked"}><span class="pf-fv-n"><b>Nenhuma</b></span></label>`+l.map(c=>`<label class="pf-fav"><input type="radio" name="fav" value="${esc(c.id)}" ${fid===c.id?"checked":""}>${carta(c)}</label>`).join(""):`<p class="pf-vazio">Você ainda não tem figurinhas. Abra um pacote no álbum!</p>`;
  $("dlgErro").textContent="";$("dlg").showModal();
  const sel=$(foco==="fav"?"fav":"lays").querySelector("input:checked")||$("lays").querySelector("input:checked");sel&&sel.focus({preventScroll:foco!=="fav"}); // foco na rede atual (ou na favorita, pelo lápis da carta)
  $("favN").textContent=l.length?`${l.length} carta${l.length===1?"":"s"}`:"";contarVisual();
  rolarAtivo($("fav"));if(foco!=="fav")rolarVisual();
}
// contador "Visual N de 15" na legenda do grupo (acompanha a escolha)
function contarVisual(){const i=[...$("lays").querySelectorAll("input")].findIndex(x=>x.checked);$("laysN").textContent=i<0?"":`Visual ${i+1} de ${$("lays").querySelectorAll("input").length}`}
// rola o corpo do diálogo (vertical) até o visual marcado ficar à vista
function rolarVisual(){const b=$("dlgCorpo"),a=$("lays").querySelector("input:checked"),l=a&&a.closest("label");if(!l)return;const br=b.getBoundingClientRect(),lr=l.getBoundingClientRect();if(lr.top<br.top+40||lr.bottom>br.bottom)b.scrollTop+=(lr.top-br.top)-(b.clientHeight-lr.height)/2}
// rola a fileira horizontal até a opção marcada (só no eixo X: não mexe no scroll do diálogo)
function rolarAtivo(c){const a=c.querySelector("input:checked"),l=a&&a.closest("label");if(l&&c.scrollWidth>c.clientWidth)c.scrollLeft=Math.max(0,l.offsetLeft-(c.clientWidth-l.offsetWidth)/2)}
// ao navegar com as setas, a opção marcada entra na vista (sem mexer na rolagem vertical do diálogo)
$("lays").addEventListener("change",()=>{contarVisual();rolarVisual()});
$("fav").addEventListener("change",ev=>{const c=$("fav"),l=ev.target.closest("label");if(l&&(l.offsetLeft<c.scrollLeft||l.offsetLeft+l.offsetWidth>c.scrollLeft+c.clientWidth))rolarAtivo(c)});
$("btCancelar").onclick=()=>$("dlg").close();
$("btGato").onclick=()=>{$("dlg").close();if(typeof openSignup==="function")openSignup()};
$("dlgF").onsubmit=async ev=>{ev.preventDefault();
  const lay=($("dlgF").querySelector("input[name=lay]:checked")||{}).value||P.perfil.layout,fav=(($("dlgF").querySelector("input[name=fav]:checked")||{}).value)||null;
  const corpo={perfil_layout:lay,carta_favorita:fav},bt=$("btSalvar");bt.disabled=true;$("dlgErro").textContent="";
  try{await Api.perfil(corpo);$("dlg").close();toast("Perfil salvo!");await carregar(P.perfil.apelido);avisar("Perfil salvo")}
  catch(e){$("dlgErro").textContent=(e&&e.erro)||"Não consegui salvar agora. Tente de novo."}
  finally{bt.disabled=false}};

// ---- carregar ----
function estado(titulo,texto,botao){$("pf").className="";$("pf").innerHTML=`<div class="pf-st"><b>${esc(titulo)}</b>${esc(texto)}${botao||""}</div>`}
async function carregar(ap){
  try{
    const [p,r]=await Promise.all([Api.perfilDe(ap,{silencioso:true}),Api.recados(ap,{silencioso:true})]);
    P=p;REC=(r&&r.itens)||[];
    document.title=`${P.perfil.apelido} · Perfil · NÃO SALVO`;
    barra();montar();
  }catch(e){
    if(e&&e.status===404)return estado("Perfil não encontrado","Confira o nome de quem você quer visitar.",`<br><a class="pf-bt" href="index.html">Voltar ao início</a>`);
    if(e&&e.status===401)return estado("Entre para ver os perfis","Os perfis são só para quem entrou com o Discord.",`<br><a class="pf-bt pri" href="/entrar.html?voltar=${encodeURIComponent(location.pathname+location.search)}">Entrar com Discord</a>`);
    estado("Não consegui carregar o perfil","Pode ser a conexão. Tente de novo em instantes.",`<br><button type="button" class="pf-bt" id="tentar">Tentar de novo</button>`);
    const t=$("tentar");if(t)t.onclick=()=>carregar(ap);
  }
}
(async()=>{
  if(pedido){if(!/^[A-Za-z0-9_.\-]{3,20}$/.test(pedido))return estado("Perfil não encontrado","Esse nome não existe por aqui.","");return carregar(pedido)}
  // sem ?u= : o próprio perfil
  try{const eu=await Api.eu({silencioso:true});if(eu&&eu.usuario){history.replaceState(null,"","perfil.html?u="+encodeURIComponent(eu.usuario.apelido)+location.hash);await carregar(eu.usuario.apelido);if(location.hash==="#editar"&&P&&P.perfil.eh_meu)abrirEdicao()}}
  catch(e){estado("Entre para ver o seu perfil","Os perfis são só para quem entrou com o Discord.",`<br><a class="pf-bt pri" href="/entrar.html?voltar=%2Fperfil.html">Entrar com Discord</a>`)}
})();
</script>
