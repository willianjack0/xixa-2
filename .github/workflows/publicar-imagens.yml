name: Publicar imagens (main)

# A cada merge na main: constrói as imagens e publica no Docker Hub (tags <sha7> e latest).
# O Portainer (stack em modo Git, consultando a cada 30 min) puxa o latest e atualiza o vp3.
# Precisa dos secrets do repositório DOCKERHUB_USERNAME e DOCKERHUB_TOKEN (token com permissão de leitura e escrita).
# Sem eles o job só avisa e termina sem publicar (não quebra o merge). Também roda à mão: Actions > Publicar imagens > Run workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-imagens
  cancel-in-progress: false   # nunca cancela uma publicação em andamento

env:
  HUB: willianjack0

jobs:
  publicar:
    name: Construir e publicar no Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEM_SEGREDOS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Segredos do Docker Hub ausentes
        if: env.TEM_SEGREDOS != 'true'
        run: echo "::warning title=Nada publicado::Crie os secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN em Settings > Secrets and variables > Actions e rode o workflow de novo."

      - uses: actions/checkout@v4
        if: env.TEM_SEGREDOS == 'true'

      - name: Versão (SHA, PR e hora)
        id: v
        if: env.TEM_SEGREDOS == 'true'
        run: |
          {
            echo "sha=$(git rev-parse --short=7 HEAD)"
            echo "pr=$(git log -1 --format=%s | sed -n 's/^Merge pull request #\([0-9][0-9]*\).*/\1/p')"
            echo "em=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: env.TEM_SEGREDOS == 'true'

      - uses: docker/login-action@v3
        if: env.TEM_SEGREDOS == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: API
        if: env.TEM_SEGREDOS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ env.HUB }}/naosalvo-api:${{ steps.v.outputs.sha }}
            ${{ env.HUB }}/naosalvo-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Site
        if: env.TEM_SEGREDOS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_BRANCH=main
            BUILD_SHA=${{ steps.v.outputs.sha }}
            BUILD_PR=${{ steps.v.outputs.pr }}
            BUILD_AT=${{ steps.v.outputs.em }}
          tags: |
            ${{ env.HUB }}/naosalvo-web:${{ steps.v.outputs.sha }}
            ${{ env.HUB }}/naosalvo-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Resumo
        if: env.TEM_SEGREDOS == 'true'
        run: |
          {
            echo "### Imagens publicadas"
            echo "- \`${HUB}/naosalvo-api:${{ steps.v.outputs.sha }}\` e \`latest\`"
            echo "- \`${HUB}/naosalvo-web:${{ steps.v.outputs.sha }}\` e \`latest\` (PR #${{ steps.v.outputs.pr }})"
            echo "O Portainer atualiza o vp3 na próxima consulta (até 30 min)."
          } >> "$GITHUB_STEP_SUMMARY"
